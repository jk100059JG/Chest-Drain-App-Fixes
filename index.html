<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#103b63"><title>Chest Drain Troubleshooting</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#19354d;background:#f3f7fa}*{box-sizing:border-box}body{margin:0}.app{max-width:620px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #dbe5ec}header{background:#103b63;color:white;padding:18px 18px 20px;position:sticky;top:0;z-index:2}header .nav{display:flex;align-items:center;justify-content:space-between;gap:10px}header button{border:1px solid #7f9db6;color:white;background:transparent;border-radius:10px;padding:9px 12px;font-size:14px}h1{font-size:22px;margin:14px 0 0}main{padding:20px 18px 55px}.alert{border-left:5px solid #c76c22;background:#fff3e6;padding:14px 16px;border-radius:8px;margin-bottom:20px;line-height:1.5}.tile{display:block;width:100%;text-align:left;background:white;border:1px solid #d6e2e9;border-radius:14px;padding:18px;margin:12px 0;box-shadow:0 3px 9px #d5e2eb50;font-size:17px;color:#103b63;font-weight:650;cursor:pointer}.tile:active{background:#e9f2f9}.tile span{float:right}h2{font-size:21px;color:#103b63;margin-top:8px}h3{font-size:16px;margin-top:24px}p,li{line-height:1.65}li{margin:7px 0}ul,ol{padding-left:23px}.note{background:#edf5fb;padding:12px 14px;border-radius:10px;margin:18px 0}.danger{background:#fff0ef;border-left:5px solid #c34e49;padding:13px;border-radius:8px;margin:18px 0}.footer{font-size:12px;color:#657888;margin-top:30px;border-top:1px solid #dce6ec;padding-top:15px}.hero{text-align:center;padding:26px 0}.hero .symbol{font-size:56px}.hero h2{margin:10px 0}.topic img{max-width:100%;border-radius:10px;margin:12px auto;display:block}a{color:#135d95}button:focus-visible{outline:3px solid #ffbc5c} @media(min-width:650px){.app{margin:20px auto;border-radius:18px;overflow:hidden;min-height:calc(100vh - 40px)}}
.home-logo{display:block;width:min(360px,95%);height:auto;margin:0 auto 12px}.choice-img{display:block;width:100%;height:auto;max-height:240px;object-fit:contain}.choice-grid{display:grid;grid-template-columns:1fr;gap:16px;max-width:330px;margin:0 auto}.choice{background:white;border:1px solid #d6e2e9;border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 3px 9px #d5e2eb50}.choice:focus-visible{outline:3px solid #ffbc5c}.choice-label{display:block;color:#103b63;font-weight:700;font-size:14px;margin-top:8px;text-align:center}@media(max-width:360px){.choice-grid{gap:7px}.choice{padding:6px}.choice-label{font-size:12px}} </style></head><body><div class="app"><header><div class="nav"><button id="back">← Back</button><strong>CHEST DRAIN</strong><button id="home">⌂ Home</button></div><h1 id="pageTitle">Troubleshooting</h1></header><main id="main"></main></div><script>
const groups={pneumo:{title:'Pneumothorax',icon:'🫁',topics:['swing','swingNoBubble','noSwing','sideholes','emphysema','bubbling']},effusion:{title:'Pleural Effusion',icon:'💧',topics:['rate','rpo','flush','pleurodesis','fibrinolytics']}};
const topics={
swing:{title:'What is a swinging chest drain?',html:`<p>Chest drains are connected to an underwater seal, which acts as a one-way valve: allowing air or fluid to leave the chest while preventing air from entering the pleural space.</p><p>In pneumothorax, air escaping from the pleural space is seen as bubbling.</p><p><strong>Swinging</strong> is movement of the fluid column with respiratory changes in intrapleural pressure. During spontaneous breathing, the fluid level rises on inspiration and falls on expiration.</p><p>Swinging suggests that the drain communicates with the pleural space.</p><ul><li>Keep the drainage bottle below chest level.</li><li>Ensure the ventilation holes on the drainage bottle lid are unobstructed.</li></ul>`},
swingNoBubble:{title:'Drain swinging but not bubbling',html:`<p>Ongoing swinging suggests the drain is still patent and communicates with the pleural space.</p><p>If a previously bubbling pneumothorax drain stops bubbling but continues swinging, the air leak may have stopped. If the patient is well, the lung may have re-expanded.</p><ul><li>Confirm re-expansion with a chest X-ray (CXR).</li><li>If pneumothorax persists, check drain position on CXR and inspect for kinking, obstruction or displacement.</li><li>If blockage is suspected, consider flushing by a competent practitioner in accordance with local guidance.</li></ul><p><a href="#flush">See chest drain flushing →</a></p>`},
noSwing:{title:'Drain not swinging or bubbling',html:`<div class="danger"><strong>First assess the patient.</strong> Perform an A–E assessment and look for tension pneumothorax.</div><p>Possible explanations:</p><ol><li>The lung has fully re-expanded.</li><li>The drain is blocked or kinked.</li><li>The drain has become displaced or disconnected.</li></ol><h3>What to check</h3><ul><li>Inspect the insertion depth and compare with the insertion record; check for exposed side holes.</li><li>Check for blockage, kinking and inadvertent clamping.</li><li>Consider flushing with sterile saline if appropriate and trained to do so.</li><li>Obtain a CXR to assess lung expansion and drain position.</li></ul><p><a href="#flush">See chest drain flushing →</a></p>`},
sideholes:{title:'Chest drain side-holes exposed',html:`<p>Visible side holes (eyelets) indicate drain displacement. Air can enter the pleural space or subcutaneous tissues, potentially causing pneumothorax or surgical emphysema.</p><ul><li>Assess for pneumothorax and surgical emphysema.</li><li>Obtain an up-to-date CXR.</li><li><strong>Do not push or advance the drain back into the chest.</strong></li><li>As a temporary measure, cover exposed eyelets and the insertion site.</li><li>Seek urgent senior/respiratory review. The drain may require removal and, if drainage is still needed, replacement at a new site.</li></ul>`},
emphysema:{title:'Subcutaneous emphysema',html:`<p>Subcutaneous emphysema is air in the tissues. A small amount may occur after drain insertion, but increasing or severe emphysema can indicate inadequate pleural air drainage and become life-threatening.</p><h3>Potential causes</h3><ul><li>Drain displacement, especially eyelets in the subcutaneous tissues.</li><li>Blocked, kinked or damaged drain.</li><li>Large ongoing air leak overwhelming the drain.</li></ul><h3>What to do</h3><div class="danger">Urgent senior review for rapidly increasing emphysema, spread to neck/face/eyes, voice change, stridor, worsening hypoxia or breathlessness.</div><ul><li>Inspect for exposed side holes.</li><li>Check for kinks, blockage and inadvertent clamping.</li><li>Check whether the drain is swinging and bubbling.</li><li>If blocked, consider flushing only if competent and appropriate.</li><li>Obtain urgent CXR for drain position and pneumothorax.</li></ul>`},
bubbling:{title:'Excessive bubbling',html:`<p>Initial bubbling after insertion for pneumothorax is expected as air leaves the pleural space. It should generally reduce as the pneumothorax resolves, sometimes becoming intermittent with coughing or expiration.</p><p>Ongoing bubbling after 48 hours warrants assessment for a persistent air leak; duration alone does not establish the need for surgery.</p><h3>Assess</h3><ul><li>Patient: worsening breathlessness, hypoxia, instability or subcutaneous emphysema.</li><li>Insertion site: exposed side holes or drain displacement.</li><li>Tubing: trace to the underwater seal and ensure connections are secure.</li><li>Drainage bottle: keep below chest level.</li></ul><p>Persistent air leak may need respiratory/thoracic surgery discussion and consideration of interventions such as blood patch or endobronchial valves.</p>`},
rate:{title:'What rate should a pleural effusion be drained?',html:`<p>Large pleural effusions should be drained in a controlled manner because rapid drainage may be associated with re-expansion pulmonary oedema and respiratory deterioration.</p><div class="note"><strong>Always check the documented drainage plan</strong> in the drain insertion record and follow local policy.</div><ul><li>As a practical guide, no more than 1.5 L in the first hour.</li><li>If 1.5 L drains before the first hour is complete, pause drainage for the remainder of that hour, according to the prescribed plan.</li><li>Thereafter, a conservative rate of approximately 500 mL/hour is often used.</li><li>Reassess if drainage exceeds the planned rate.</li></ul><div class="danger"><strong>Do not clamp a bubbling pneumothorax drain</strong> because of the risk of tension pneumothorax.</div>`},
rpo:{title:'Re-expansion pulmonary oedema',html:`<p>Re-expansion pulmonary oedema (RPO) is an uncommon but potentially serious complication following re-expansion of a collapsed lung after pleural effusion or pneumothorax drainage.</p><h3>Risk factors</h3><ul><li>Large effusion or pneumothorax with substantial collapse.</li><li>Prolonged lung collapse.</li><li>Rapid drainage or re-expansion.</li><li>Excessive suction/high negative pressure.</li></ul><h3>Signs</h3><ul><li>Breathlessness, rising oxygen requirement, chest tightness or persistent cough.</li><li>Severe cases: haemodynamic instability.</li><li>CXR: new air-space opacification in the re-expanded lung.</li></ul><h3>Management</h3><ul><li>Stop further pleural fluid drainage and urgently seek senior input; follow local protocol.</li><li>Give oxygen to the appropriate target and obtain CXR.</li><li>Consider respiratory support (CPAP/HFNO/critical care) with senior input.</li><li>Routine diuresis is not evidence-based for RPO.</li></ul><div class="danger">Never clamp a <strong>bubbling pneumothorax drain</strong> because of tension pneumothorax risk.</div>`},
flush:{title:'How to flush a chest drain',html:`<p>Small-bore drains can block with fibrin, debris, thick pleural fluid or blood. Loss of swinging and drainage may indicate obstruction. Flushing may restore patency.</p><div class="danger">Only flush a chest drain if trained to do so.</div><h3>Technique described in your draft</h3><ol><li>Use aseptic non-touch technique.</li><li>Turn the three-way tap off to the side port.</li><li>Attach a syringe containing 20 mL sterile normal saline.</li><li>Turn the tap off to the drainage bottle.</li><li>Gently flush saline.</li><li>Return the tap to its correct drainage position, off to the side port, and replace the bung.</li><li>Reassess swinging and drainage.</li></ol><p class="note">This section should be clinically approved against local policy before publication.</p>`},
pleurodesis:{title:'Pleurodesis',html:`<p>Pleurodesis aims to make the visceral and parietal pleura adhere. This section describes issues clinicians may encounter after talc pleurodesis or autologous blood patch, rather than how to perform either procedure.</p><h3>Talc pleurodesis</h3><ul><li>Chest pain: ensure adequate analgesia.</li><li>Transient fever/inflammatory response.</li><li>Rare acute lung injury/ARDS, less frequent with modern graded talc.</li></ul><p>Drain removal depends on the clinical context, drainage output and local pleurodesis protocol; your draft suggests 48–72 hours and less than 200–250 mL in 24 hours.</p><h3>Autologous blood patch</h3><p>The patient's own venous blood is instilled through the drain to manage persistent air leak. Unlike talc pleurodesis, complete lung expansion is not always necessary.</p><ul><li>Possible chest pain, fever and pleural infection/empyema.</li><li>Rare drain blockage, potentially worsening pneumothorax.</li></ul>`},
fibrinolytics:{title:'Fibrinolytics (tPA/DNase)',html:`<p>In some cases of pleural infection, intrapleural tPA (alteplase) and DNase (dornase alfa) are used to break down fibrinous loculations and reduce fluid viscosity. This is a complications-awareness page, not administration guidance.</p><h3>What you may see</h3><ul><li>Increased drain output (expected).</li><li>Blood-stained pleural fluid.</li><li>Chest pain; ensure adequate analgesia.</li></ul><div class="danger"><strong>Watch for pleural bleeding:</strong> frank blood in the drainage, haemodynamic instability or a significant haemoglobin fall require urgent assessment.</div><p>Anticoagulation increases bleeding risk. Decisions about withholding DOACs or warfarin require an individualised plan with the treating team.</p>`}
};
function current(){return decodeURIComponent(location.hash.slice(1))||'welcome'}
function go(id){if(current()===id){render();return;}location.hash=id}
function render(){
 const id=current(),main=document.getElementById('main'),title=document.getElementById('pageTitle'),header=document.querySelector('header');
 header.style.display=id==='welcome'?'none':'block';
 document.getElementById('back').style.visibility=(id==='welcome'||id==='home')?'hidden':'visible';
 if(id==='welcome'){
  main.innerHTML=`<div class="hero" style="padding-top:8vh"><img class="home-logo" src="./home.png" alt="Chest Drain Troubleshooting illustrated logo"><button class="tile" style="text-align:center;max-width:240px;margin:24px auto" onclick="go('home')">Tap to open →</button></div>`;
 }else if(id==='home'){
  title.textContent='Choose a section';
  main.innerHTML=`<div class="alert"><strong>If clinically unstable:</strong> perform an A–E assessment and seek urgent senior support.</div><div class="choice-grid"><button class="choice" onclick="go('pneumo')"><img class="choice-img" src="./pneumothorax.png" alt="Pneumothorax"></button><button class="choice" onclick="go('effusion')"><img class="choice-img" src="./effusion.png" alt="Pleural effusion"></button></div><div class="footer">Educational clinical reference. Follow local policies and seek senior advice. Clinical review required before use in patient care.</div>`;
 }else if(groups[id]){
  const g=groups[id];title.textContent=g.title;
  main.innerHTML=`<h2>${g.title}</h2>${g.topics.map(t=>`<button class="tile" onclick="go('${t}')">${topics[t].title}<span>›</span></button>`).join('')}`;
 }else if(topics[id]){
  title.textContent=topics[id].title;
  main.innerHTML=`<article class="topic"><h2>${topics[id].title}</h2>${topics[id].html}</article><button class="tile" onclick="back()">← Back to topics</button><div class="footer">Based on the supplied draft. Clinical review required before deployment for patient care.</div>`;
 }else {go('welcome');return;}
 window.scrollTo(0,0);
}
function back(){const id=current();if(id==='home')go('welcome');else if(groups[id])go('home');else if(topics[id])go(groups.pneumo.topics.includes(id)?'pneumo':'effusion');else go('welcome')}
document.getElementById('home').onclick=()=>go('welcome');
document.getElementById('back').onclick=back;
window.addEventListener('hashchange',render);
render();
</script></body></html>
